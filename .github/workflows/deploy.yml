# Portfolio is now deployed via Vercel (vercel.com).
# Vercel auto-deploys on push to main-branch — no manual workflow needed.
#
# Admin panel (admin/) is deployed as a separate Vercel project.
#
# This file is kept for reference. Delete it if you want to avoid confusion.
# The old GitHub Pages workflow (output: "export" → gh-pages) has been superseded.

name: CI (lint only)

on:
  push:
    branches: [main-branch]
  pull_request:
    branches: [main-branch]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
